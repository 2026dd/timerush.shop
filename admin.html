<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders Dashboard — Time Rush</title><link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css"><style>
.tr-admin{max-width:1180px;margin:auto;padding:46px 22px 80px}.tr-admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.tr-admin h1{font-family:'Playfair Display',serif}.tr-admin-panel{background:var(--card,#111);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:24px}.tr-login{max-width:440px;margin:55px auto}.tr-admin input,.tr-admin select{width:100%;padding:13px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#090909;color:#fff}.tr-admin label{display:block;margin:14px 0 7px;color:var(--muted,#aaa)}.tr-orders{display:grid;gap:14px}.tr-order{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:18px;background:rgba(255,255,255,.025)}.tr-order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tr-order-meta{color:var(--muted,#aaa);font-size:13px;line-height:1.8}.tr-order-items{margin:12px 0;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);line-height:1.9}.tr-order-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tr-admin-actions{display:flex;gap:10px;align-items:center}.tr-admin-actions select{min-width:150px}.tr-admin .btn{cursor:pointer}.tr-admin-error{color:#ff9292;margin-top:12px}.tr-empty{padding:30px;text-align:center;color:var(--muted,#aaa)}@media(max-width:600px){.tr-admin{padding:28px 14px 60px}.tr-admin-panel{padding:18px}.tr-admin-head{align-items:flex-start}}
</style></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><img src="assets/images/logo-mark.png" class="brand-mark" alt="Time Rush"><div class="brand-text"><div class="brand-name">Time Rush</div><div class="brand-tag">Orders Dashboard</div></div></a><a class="nav-link" href="index.html">Back to store</a></div></header>
<main class="tr-admin">
<section id="loginPanel" class="tr-admin-panel tr-login"><h1>Admin Login</h1><p class="muted">Sign in to view and manage customer orders.</p><form id="loginForm"><label for="adminEmail">Email</label><input id="adminEmail" type="email" autocomplete="username" required><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required><button class="btn btn-primary" style="width:100%;margin-top:20px" type="submit">Sign in</button><p id="loginError" class="tr-admin-error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="tr-admin-head"><div><h1>Orders</h1><p class="muted">Manage every order received from Time Rush.</p></div><div class="tr-admin-actions"><button id="refreshOrders" class="btn btn-ghost">Refresh</button><button id="signOut" class="btn btn-ghost">Sign out</button></div></div><div class="tr-admin-panel"><div class="tr-admin-head" style="margin-bottom:14px"><strong id="orderCount">0 orders</strong><select id="statusFilter" aria-label="Filter orders"><option value="all">All orders</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div id="ordersList" class="tr-orders"><div class="tr-empty">Loading orders…</div></div><p id="dashboardError" class="tr-admin-error"></p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/admin-orders.js"></script>
</body></html>
